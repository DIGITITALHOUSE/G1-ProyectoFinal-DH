<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Reserva</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #ffffff; max-width: 600px; margin: auto; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);">
    <!-- Encabezado con imagen -->
    <tr>
        <td align="center" style="background-color: #f4f4f4">
            <img src="https://i.postimg.cc/x1cnfsxK/logo.png" alt="Cowork Space" width="200px" style="padding:30px 0px 20px 0px">
        </td>
    </tr>

    <!-- Contenido principal -->
    <tr>
        <td style="padding: 20px; text-align: center;">
            <h2 style="color: #333;">¡Reserva Confirmada, <span th:text="${name}"></span>! 🎉</h2>
            <p style="color: #555; font-size: 16px;">Tu reserva en <strong th:text="${spaceName}"></strong> ha sido confirmada.</p>
            <p style="color: #555; font-size: 16px;">Aquí están los detalles:</p>

            <table width="100%" cellspacing="0" cellpadding="10" border="0" style="background-color: #f9f9f9; border-radius: 5px; margin: 20px auto; font-size: 16px;">
                <tr>
                    <td style="text-align: left;"><strong>📍 Espacio:</strong></td>
                    <td style="text-align: right;" th:text="${spaceName}"></td>
                </tr>
                <tr>
                    <td style="text-align: left;"><strong>📅 Fecha:</strong></td>
                    <td style="text-align: right;" th:text="${reservationReservationDate}"></td>
                </tr>
                <tr>
                    <td style="text-align: left;"><strong>🕒 Hora:</strong></td>
                    <td style="text-align: right;">
                        <span th:text="${reservationStartHour}"></span> - <span th:text="${reservationEndHour}"></span>
                    </td>
                </tr>
                <tr>
                    <td style="text-align: left;"><strong>🏢 Dirección:</strong></td>
                    <td style="text-align: right;" th:text="${spaceDirection}"></td>
                </tr>
                <tr>
                    <td style="text-align: left;"><strong>📞 Contacto:</strong></td>
                    <td style="text-align: right;"><a href="mailto:cowork.lat@gmail.com" style="color: #007BFF;">cowork.lat@gmail.com</a></td>
                </tr>
            </table>

            <p style="color: #555; font-size: 16px;">Si tienes preguntas o deseas modificar tu reserva, contáctanos.</p>

            <!-- Botón de acción -->
            <a href="https://cowork.iriscompany.io/reservations" target="_blank" style="display: inline-block; background-color: #007BFF; color: #ffffff; text-decoration: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; margin-top: 10px;">
                Ver Mi Reserva 📅
            </a>
        </td>
    </tr>

    <!-- Pie de página -->
    <tr>
        <td style="background-color: #f4f4f4; padding: 15px; text-align: center; font-size: 14px; color: #888;">
            <p>&copy; 2025 Cowork. Todos los derechos reservados.</p>
        </td>
    </tr>
</table>

</body>
</html>
